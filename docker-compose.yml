services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gold
      POSTGRES_USER: gold
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (URL-safe value)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gold -d gold"]
      interval: 5s
      timeout: 3s
      retries: 20
  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://gold:${POSTGRES_PASSWORD}@postgres:5432/gold
    volumes:
      - pipeline-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
  dashboard:
    build: .
    command: ["python", "-m", "goldtrading", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql://gold:${POSTGRES_PASSWORD}@postgres:5432/gold
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - pipeline-data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
  pipeline-data:
