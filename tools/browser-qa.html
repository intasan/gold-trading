<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gold dashboard browser QA</title><style>body{font:14px system-ui;padding:20px}button{padding:12px;margin:4px}iframe{display:block;height:900px;border:1px solid #777;max-width:none}pre{white-space:pre-wrap}#wrap{overflow:auto}</style><h1>Gold dashboard browser QA</h1><button id="run">Run responsive checks</button><button data-width="360">360 mobile</button><button data-width="390">390 mobile</button><button data-width="768">768 tablet</button><button data-width="1440">1440 desktop</button><p id="status">Ready</p><pre id="results"></pre><div id="wrap"><iframe title="Dashboard viewport" id="frame" src="index.html" width="390"></iframe></div><script>
const f=document.querySelector('iframe');const pause=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
for(const b of document.querySelectorAll('[data-width]'))b.onclick=()=>{f.width=b.dataset.width;document.querySelector('#status').textContent='Viewport '+b.dataset.width;};
document.querySelector('#run').onclick=async()=>{const rows=[];for(const width of [360,390,768,1440]){f.width=width;await pause();const d=f.contentDocument;rows.push({width,viewport:f.contentWindow.innerWidth,documentWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>width,dashboardLoaded:!d.querySelector('#dashboard').hidden,quoteGold:d.querySelector('#quote-xau').textContent,tableRows:d.querySelectorAll('#price-table tr').length,firstPeriod:d.querySelector('#price-table tr')?.innerText,chartPresent:!!d.querySelector('#history-chart svg'),modelStatus:d.querySelector('#model-status').textContent,modelForecast:d.querySelector('#forecast').textContent});}document.querySelector('#results').textContent=JSON.stringify(rows,null,2);document.querySelector('#status').textContent='Complete';f.width=390;};
</script></html>
