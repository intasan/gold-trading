name: Pipeline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q goldtrading dags
      - run: node --check web/dashboard.js
      - run: python tools/check_snapshot.py
      - run: python tools/check_links.py
      - run: python -m tools.verify_api
